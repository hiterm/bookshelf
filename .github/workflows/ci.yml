name: ci
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  openspec:
    name: OpenSpec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate OpenSpec
        run: pnpm dlx @fission-ai/openspec@1.6.0 validate --all --strict --no-interactive

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build

  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - run: git diff --exit-code

  test-e2e-mock-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - run: pnpm run test:e2e:mock-api

  test-e2e-demo-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - run: pnpm run test:e2e:demo-mode

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - id: api-version
        run: echo "version=$(tr -d '[:space:]' < bookshelf-api.version)" >> "$GITHUB_OUTPUT"
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            --network host \
            -e POSTGRES_USER=bookshelf \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=bookshelf \
            postgres:15
          for _ in {1..30}; do
            if docker exec postgres pg_isready -U bookshelf; then
              echo "PostgreSQL ready"; exit 0
            fi
            sleep 1
          done
          docker logs postgres; exit 1
      - name: Start JWKS server
        run: |
          node e2e-integration/jwks-server.mjs > /tmp/jwks.log 2>&1 &
          for _ in {1..30}; do
            if curl -fs http://localhost:9999/.well-known/jwks.json > /dev/null; then
              echo "JWKS server ready"; exit 0
            fi
            sleep 1
          done
          cat /tmp/jwks.log; exit 1
      - name: Start bookshelf-api
        env:
          API_VERSION: ${{ steps.api-version.outputs.version }}
        run: |
          docker run -d \
            --name bookshelf-api \
            --network host \
            -e DATABASE_URL=postgres://bookshelf:password@localhost:5432/bookshelf \
            -e PORT=8080 \
            -e ALLOWED_ORIGINS=http://localhost:4173 \
            -e JWT_AUDIENCE=test-audience \
            -e JWT_DOMAIN=test-issuer.local \
            -e JWKS_URL=http://localhost:9999/.well-known/jwks.json \
            ghcr.io/hiterm/bookshelf-api:"$API_VERSION"
          for _ in {1..60}; do
            if curl -fs http://localhost:8080/health > /dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 1
          done
          docker logs bookshelf-api; exit 1
      - run: pnpm run test:e2e:integration

  test-integration-api-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            --network host \
            -e POSTGRES_USER=bookshelf \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=bookshelf \
            postgres:15
          for _ in {1..30}; do
            if docker exec postgres pg_isready -U bookshelf; then
              echo "PostgreSQL ready"; exit 0
            fi
            sleep 1
          done
          docker logs postgres; exit 1
      - name: Start JWKS server
        run: |
          node e2e-integration/jwks-server.mjs > /tmp/jwks.log 2>&1 &
          for _ in {1..30}; do
            if curl -fs http://localhost:9999/.well-known/jwks.json > /dev/null; then
              echo "JWKS server ready"; exit 0
            fi
            sleep 1
          done
          cat /tmp/jwks.log; exit 1
      - name: Start bookshelf-api
        run: |
          image=ghcr.io/hiterm/bookshelf-api:main
          docker pull "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "Using bookshelf-api main image: $digest"
          docker run -d \
            --name bookshelf-api \
            --network host \
            -e DATABASE_URL=postgres://bookshelf:password@localhost:5432/bookshelf \
            -e PORT=8080 \
            -e ALLOWED_ORIGINS=http://localhost:4173 \
            -e JWT_AUDIENCE=test-audience \
            -e JWT_DOMAIN=test-issuer.local \
            -e JWKS_URL=http://localhost:9999/.well-known/jwks.json \
            "$image"
          for _ in {1..60}; do
            if curl -fs http://localhost:8080/health > /dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 1
          done
          docker logs bookshelf-api; exit 1
      - run: pnpm run test:e2e:integration
