name: Update MSW

on:
  workflow_dispatch:

concurrency:
  group: update-msw
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update MSW and its service worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update MSW and regenerate its worker
        run: |
          pnpm update --latest --dev msw
          pnpm run generate:msw
      - name: Check update scope
        id: changes
        run: |
          unexpected_files=$(
            git status --short --untracked-files=all |
              awk '{print $2}' |
              grep -vEx 'package.json|pnpm-lock.yaml|public/mockServiceWorker.js' || true
          )
          if [[ -n "$unexpected_files" ]]; then
            echo "Unexpected files changed:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi

          if git diff --quiet -- \
            package.json \
            pnpm-lock.yaml \
            public/mockServiceWorker.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "MSW is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Commit and push update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: chore/update-msw
        run: |
          msw_version=$(node -p "require('./package.json').devDependencies.msw")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git checkout -B "$UPDATE_BRANCH"
          git add package.json pnpm-lock.yaml public/mockServiceWorker.js
          git commit -m "Update MSW to $msw_version"

          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null; then
            git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"
          else
            git push origin "HEAD:$UPDATE_BRANCH"
          fi
      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: chore/update-msw
        run: |
          if [[ $(gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq length) -gt 0 ]]; then
            echo "An open MSW update pull request already exists."
            exit 0
          fi

          msw_version=$(node -p "require('./package.json').devDependencies.msw")
          body_file="$RUNNER_TEMP/update-msw-pr.md"
          {
            echo "## Summary"
            echo
            echo "- Update MSW to \`$msw_version\`"
            echo "- Regenerate \`public/mockServiceWorker.js\` with the updated MSW CLI"
            echo
            echo "This pull request was generated by the Update MSW GitHub Actions workflow."
          } > "$body_file"

          gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "Update MSW to $msw_version" \
            --body-file "$body_file"
        shell: bash
      - name: Run frontend CI for update branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: chore/update-msw
        run: gh workflow run ci.yml --ref "$UPDATE_BRANCH"
