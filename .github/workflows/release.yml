name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # secrets-outside-env: this trusted main release job needs the GitHub App key
  # to create a token for release pull requests.
  tagpr: # zizmor: ignore[secrets-outside-env]
    name: Update release pull request or tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure tagpr labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create tagpr \
            --color 0E8A16 \
            --description "Pull requests managed by tagpr" \
            --force
          gh label create "tagpr:minor" \
            --color FBCA04 \
            --description "Release PR with a minor version bump" \
            --force
          gh label create "tagpr:major" \
            --color B60205 \
            --description "Release PR with a major version bump" \
            --force
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOOKSHELF_DELIVERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOOKSHELF_DELIVERY_APP_PRIVATE_KEY }}
      - name: Run tagpr
        uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
