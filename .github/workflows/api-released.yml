name: Update released API version

on:
  repository_dispatch:
    types:
      - api-released

concurrency:
  group: api-release
  cancel-in-progress: false

permissions: {}

jobs:
  update: # zizmor: ignore[secrets-outside-env]
    # secrets-outside-env: this trusted dispatch job needs the delivery App key
    # to push a branch and create a pull request that triggers normal PR CI.
    name: Update API version
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate released version
        env:
          API_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [[ ! "${API_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid API version: ${API_VERSION}" >&2
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOOKSHELF_DELIVERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOOKSHELF_DELIVERY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: bookshelf
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare update branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="update/bookshelf-api"
          gh auth setup-git
          git fetch origin "refs/heads/main"
          git switch --detach FETCH_HEAD
          echo "baseline=$(tr -d '[:space:]' < bookshelf-api.version)" >> "${GITHUB_OUTPUT}"
          existing_pr=$(gh pr list \
            --state open \
            --base main \
            --head "${branch}" \
            --json number,headRepository \
            --jq "[.[] | select(.headRepository.nameWithOwner == \"${GH_REPO}\")][0].number // empty")
          echo "pr=${existing_pr}" >> "${GITHUB_OUTPUT}"

          remote_sha=$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)
          echo "remote-sha=${remote_sha}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${existing_pr}" ]]; then
            git fetch origin "refs/heads/${branch}"
            git switch -C "${branch}" FETCH_HEAD
          else
            git switch -C "${branch}" FETCH_HEAD
          fi

      - name: Update API version
        id: update
        env:
          API_VERSION: ${{ github.event.client_payload.version }}
          BASELINE_VERSION: ${{ steps.branch.outputs.baseline }}
        run: scripts/update-api-version.sh "${API_VERSION}" bookshelf-api.version "${BASELINE_VERSION}"

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          API_VERSION: ${{ github.event.client_payload.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          EXISTING_PR: ${{ steps.branch.outputs.pr }}
          REMOTE_SHA: ${{ steps.branch.outputs.remote-sha }}
        run: |
          branch="update/bookshelf-api"
          title="Update bookshelf-api to ${API_VERSION}"
          body="Automated API version update triggered by the bookshelf-api release."

          git config user.name "bookshelf-delivery[bot]"
          git config user.email "bookshelf-delivery[bot]@users.noreply.github.com"
          git add bookshelf-api.version
          git commit -m "${title}"
          git push --force-with-lease="refs/heads/${branch}:${REMOTE_SHA}" \
            origin "HEAD:refs/heads/${branch}"

          if [[ -n "${EXISTING_PR}" ]]; then
            gh pr edit "${EXISTING_PR}" --title "${title}" --body "${body}"
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "${title}" \
              --body "${body}"
          fi
