overwrite: true
schema: "src/graphql/schema.graphql"
documents: "src/**/*.graphql"
config:
  scalars:
    Date:
      input: string
      output: string
    DateTime:
      input: string
      output: string
    JSON:
      input: unknown
      output: unknown
generates:
  src/generated/graphql-schema.ts:
    config:
      enumsAsTypes: true
    plugins:
      - "typescript"
  src/generated/graphql-request.ts:
    config:
      enumsAsTypes: true
      importSchemaTypesFrom: 'src/generated/graphql-schema'
      namespacedImportName: 'Types'
    plugins:
      - add:
          content: "export * from './graphql-schema';"
      - "typescript-operations"
      - "typescript-graphql-request"
