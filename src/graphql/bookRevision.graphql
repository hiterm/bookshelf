query bookRevision($bookId: ID!, $revisionNumber: Int!) {
  bookRevision(bookId: $bookId, revisionNumber: $revisionNumber) {
    bookId
    revisionNumber
    title
    authorIds
    isbn
    read
    owned
    priority
    format
    store
    purchaseDate
    bookCreatedAt
    bookUpdatedAt
    createdAt
  }
}
