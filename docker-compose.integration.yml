services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    network_mode: host
    environment:
      POSTGRES_USER: bookshelf
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookshelf
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bookshelf"]
      interval: 1s
      timeout: 5s
      retries: 30

  jwks-server:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    network_mode: host
    working_dir: /app
    volumes:
      - ./e2e-integration:/app:ro
    command: node jwks-server.mjs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:9999/.well-known/jwks.json",
        ]
      interval: 1s
      timeout: 5s
      retries: 30

  bookshelf-api:
    image: ghcr.io/hiterm/bookshelf-api:${API_VERSION:?API_VERSION must be set}
    network_mode: host
    environment:
      DATABASE_URL: postgres://bookshelf:password@localhost:5432/bookshelf
      PORT: "8080"
      ALLOWED_ORIGINS: http://localhost:4173
      JWT_AUDIENCE: test-audience
      JWT_DOMAIN: test-issuer.local
      JWKS_URL: http://localhost:9999/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
      jwks-server:
        condition: service_healthy
