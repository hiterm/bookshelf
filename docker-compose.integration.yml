services:
  postgres:
    image: postgres:15@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
    network_mode: host
    environment:
      POSTGRES_USER: bookshelf
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookshelf
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bookshelf"]
      interval: 1s
      timeout: 5s
      retries: 30

  jwks-server:
    image: node:26.13.0-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
    network_mode: host
    working_dir: /app
    volumes:
      - ./e2e-integration:/app:ro
    command: node jwks-server.mjs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:9999/.well-known/jwks.json",
        ]
      interval: 1s
      timeout: 5s
      retries: 30

  bookshelf-api:
    image: ghcr.io/hiterm/bookshelf-api:${API_VERSION:?API_VERSION must be set}
    network_mode: host
    environment:
      DATABASE_URL: postgres://bookshelf:password@localhost:5432/bookshelf
      PORT: "8080"
      ALLOWED_ORIGINS: http://localhost:4173
      JWT_AUDIENCE: test-audience
      JWT_DOMAIN: test-issuer.local
      JWKS_URL: http://localhost:9999/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
      jwks-server:
        condition: service_healthy
